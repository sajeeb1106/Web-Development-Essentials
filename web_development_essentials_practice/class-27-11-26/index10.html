<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p></p>
    <p></p>
    <p></p>
    <p id="demo"></p>
    <input type="button" onclick="myFunction()" value="How many elements tag p?">
    <script>
        function myFunction() {
            var x = document.getElementsByTagName("p");
            document.getElementById("demo").innerHTML = x.length;
        }
    </script>
</body>
</html>
