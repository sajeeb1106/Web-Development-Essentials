<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <ol>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol type="a">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol reversed>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol start="5">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol reversed start="7">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ol reversed start="7" type="A">
        <li>First</li>
        <li>Second</li>
        <li>Third</li>
    </ol>

    <ul>
        <li>First</li>
        <li>Second</li>
        <li>Third</li>  
    </ul>   
</body>
</html>
